<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TuCitas | Crear cuenta</title><link rel="stylesheet" href="styles.css"></head><body data-auth="guest"><main class="auth-shell"><section class="auth-card"><div class="brand"><div class="brand-mark">📅</div><div><h1>TuCitas</h1><p>Gestión simple de citas</p></div></div><h2>Crear cuenta</h2><p class="subtitle">Regístrate para comenzar a gestionar citas.</p><div id="errorBox" class="error-box" role="alert"></div><form id="authForm" data-mode="register"><div class="auth-grid"><div class="field"><label for="nombres">Nombres <span class="required">*</span></label><input id="nombres" name="nombres" autocomplete="given-name" maxlength="100" required></div><div class="field"><label for="apellidos">Apellidos <span class="required">*</span></label><input id="apellidos" name="apellidos" autocomplete="family-name" maxlength="100" required></div><div class="field full"><label for="email">Correo electrónico <span class="required">*</span></label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Contraseña <span class="required">*</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label for="confirmPassword">Confirmar contraseña <span class="required">*</span></label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div><div class="full"><button class="btn btn-primary" type="submit">Crear cuenta</button></div></div></form><p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p></section></main><script src="auth.js"></script></body></html>
