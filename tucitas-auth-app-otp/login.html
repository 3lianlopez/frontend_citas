<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TuCitas | Iniciar sesión</title><link rel="stylesheet" href="styles.css"></head><body data-auth="guest"><main class="auth-shell"><section class="auth-card"><div class="brand"><div class="brand-mark">📅</div><div><h1>TuCitas</h1><p>Gestión simple de citas</p></div></div><h2>Bienvenido de nuevo</h2><p class="subtitle">Inicia sesión para gestionar tus citas.</p><div id="errorBox" class="error-box" role="alert"></div><form id="authForm" data-mode="login"><div class="field"><label for="email">Correo electrónico <span class="required">*</span></label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Contraseña <span class="required">*</span></label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required></div><button class="btn btn-primary" type="submit">Iniciar sesión</button></form><p class="auth-link">¿Aún no tienes cuenta? <a href="registro.html">Crear una cuenta</a></p></section></main><script src="auth.js"></script><script>if(new URLSearchParams(location.search).get('verified')){const e=document.querySelector('#errorBox');e.textContent='Correo verificado correctamente. Ya puedes iniciar sesión.';e.classList.add('show','success-box')}</script></body></html>
