<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TuCitas | Gestión de citas</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="topbar-content"><div class="brand"><div class="brand-mark">📅</div><div><h1>TuCitas</h1><p>Gestión simple de citas</p></div></div><div class="top-actions"><div class="connection"><i id="connectionDot" class="dot"></i><span id="connectionText">Comprobando servicio…</span></div><button id="logoutBtn" class="btn btn-light btn-small">Cerrar sesión</button></div></div></header><main><section class="toolbar"><div class="search-box"><input id="searchId" type="number" min="1" placeholder="Buscar una cita por ID"><button id="searchBtn" class="btn btn-light">Buscar</button><button id="refreshBtn" class="btn btn-light refresh">↻ Mostrar todas</button></div><button id="configBtn" class="btn btn-light">⚙ Servicio</button></section><section class="grid"><article class="card"><header class="card-header"><h2 id="listTitle">Todas las citas</h2><span id="counter" class="counter">0 registros</span></header><div id="listContainer" class="table-wrap"><div class="loading">Cargando citas…</div></div></article><article class="card form-card"><header class="card-header"><h2 id="formTitle">Nueva cita</h2></header><form id="citaForm" class="form-body"><div class="form-grid"><p id="modeNote" class="mode-note">Completa los datos para registrar una cita.</p><div><label for="documento">Documento <span class="required">*</span></label><input id="documento" name="documento" maxlength="100" required></div><div><label for="nombres">Nombres <span class="required">*</span></label><input id="nombres" name="nombres" maxlength="100" required></div><div><label for="apellidos">Apellidos <span class="required">*</span></label><input id="apellidos" name="apellidos" maxlength="100" required></div><div><label for="tipoCita">Tipo de cita <span class="required">*</span></label><input id="tipoCita" name="tipoCita" maxlength="100" required></div><div><label for="fecha">Fecha <span class="required">*</span></label><input id="fecha" name="fecha" type="date" required></div><div><label for="hora">Hora <span class="required">*</span></label><input id="hora" name="hora" type="time" step="1" required></div><div class="form-actions"><button id="cancelBtn" class="btn btn-light" type="button" hidden>Cancelar</button><button id="saveBtn" class="btn btn-primary" type="submit">Crear cita</button></div></div></form></article></section></main><div id="toast" class="toast" role="status"></div><dialog id="deleteDialog"><div class="dialog-body"><h3>Eliminar cita</h3><p>¿Seguro que deseas eliminar la cita <strong id="deleteLabel"></strong>?</p></div><div class="dialog-actions"><button id="closeDeleteBtn" class="btn btn-light">Cancelar</button><button id="confirmDeleteBtn" class="btn btn-danger">Sí, eliminar</button></div></dialog><dialog id="configDialog"><form id="configForm"><div class="dialog-body"><h3>Configurar servicio</h3><p>Indica la URL base de la API REST.</p><label for="apiUrl">URL del servicio</label><input id="apiUrl" type="url" required></div><div class="dialog-actions"><button id="closeConfigBtn" type="button" class="btn btn-light">Cancelar</button><button class="btn btn-primary">Guardar y conectar</button></div></form></dialog><script src="auth.js"></script><script src="app.js"></script></body></html>
